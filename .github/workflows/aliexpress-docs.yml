name: AliExpress docs (Producción)
on:
  push:
    paths: ["produccion/api/docs_peticion.txt"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Descargar documentación
        run: CATS="$(cut -d" " -f1 produccion/api/docs_peticion.txt)" python3 produccion/api/docs_scraper.py
      - name: Guardar
        run: |
          git config user.name "nesma-bot"
          git config user.email "nesma-bot@users.noreply.github.com"
          git add produccion/api/docs
          git commit -m "Docs AliExpress descargadas" || exit 0
          git pull --rebase && git push
